id: io.github.db_mobile.resonance
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
command: resonance
rename-icon: icon
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: resonance
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/resonance/cargo
        npm_config_cache: /run/build/resonance/flatpak-node/npm-cache
    build-commands:
      - npm install --offline
      - npm run build:prod
      - REMOVE_UNUSED_COMMANDS="$PWD/src-tauri" cargo build --release --frozen -p resonance
      - install -Dm755 target/release/resonance /app/bin/resonance
      - install -Dm644 assets/icons/icon.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -Dm644 assets/desktop/io.github.db_mobile.resonance.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.db_mobile.resonance.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: git
        url: https://github.com/db-mobile/resonance.git
        tag: v3.5.3
        commit: e0bff751f8be95872b4ba848784c287a826831b7
        x-checker-data:
          type: git
          tag-pattern: ^v\d+(?:\.\d+)*$
      - generated-sources.json
      - cargo-sources.json
